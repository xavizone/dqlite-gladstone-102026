# Gladstone MRM | Bonus B3 - one operator pipeline (+ its data quality) as code
# One target per environment / attendee: a new copy = add a target, run plan, run deploy.
manifest_version: 2
type: DCM_PROJECT
default_target: 'NIELS'

targets:
  NIELS:
    project_name: 'GLADSTONE_DQ_LITE.RIVERSIDE_NIELS_DCM.OPERATOR_PIPELINE'
    project_owner: DQ_LITE_ATTENDEE
    templating_config: 'NIELS'
  TEST1:
    project_name: 'GLADSTONE_DQ_LITE.RIVERSIDE_TEST1_DCM.OPERATOR_PIPELINE'
    project_owner: DQ_LITE_ATTENDEE
    templating_config: 'TEST1'

templating:
  defaults:
    db: 'GLADSTONE_DQ_LITE'
    wh: 'DQ_LITE_WH'
    dq_schedule: '5 MINUTE'          # production: TRIGGER_ON_CHANGES on Bronze
    reporting_lag: '1 minute'
  configurations:
    NIELS:
      schema: 'RIVERSIDE_NIELS_DCM'
      operator_id: 'RIVERSIDE'
    TEST1:
      schema: 'RIVERSIDE_TEST1_DCM'
      operator_id: 'RIVERSIDE'
